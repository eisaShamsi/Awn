services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: awn
      POSTGRES_USER: awn
      POSTGRES_PASSWORD: awn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - awn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awn -d awn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  awn-postgres-data:
