name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AWN_DATABASE_URL: postgresql+psycopg://awn:awn@localhost:5432/awn_test
      AWN_TEST_POSTGRES_URL: postgresql+psycopg://awn:awn@localhost:5432/awn_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: awn_test
          POSTGRES_USER: awn
          POSTGRES_PASSWORD: awn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awn -d awn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Migrate database
        run: alembic upgrade head && alembic check
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest
