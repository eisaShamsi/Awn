[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awn"
version = "0.1.0"
description = "Awn (عَوْن): A versatile and intelligent aide"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
awn = "awn.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["awn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
